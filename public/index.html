<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyAccess</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2316171b'/><text x='16' y='21.5' text-anchor='middle' font-family='-apple-system,Helvetica,Arial,sans-serif' font-weight='800' font-size='15' fill='%23f97362'>EA</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- loading splash: "ES" splits apart to reveal EASY ACCESS, then fades once data has loaded -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-word">
      <span class="sp-cap">E</span><span class="sp-mid" id="sp-mid"><span style="--i:0">A</span><span style="--i:1">S</span><span style="--i:2">Y</span><span style="--i:3">&nbsp;</span><span style="--i:4">A</span><span style="--i:5">C</span><span style="--i:6">C</span><span style="--i:7">E</span><span style="--i:8">S</span></span><span class="sp-cap">S</span>
    </div>
    <div class="splash-bar"><i></i></div>
  </div>
  <script>
    // size the reveal to the hidden letters' real width so E and S land exactly in place
    (function () { var m = document.getElementById('sp-mid'); m.style.setProperty('--w', m.scrollWidth + 'px'); })();
  </script>
  <div class="app">
    <header class="top">
      <div class="hello">
        <h1 id="greeting">Hello</h1>
        <p id="date"></p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="actions">
        <div class="sources" id="sources"></div>
        <button id="notify" class="btn" title="Desktop alerts 10 min before events and for new items">Alerts off</button>
        <button id="refresh" class="btn icon" title="Refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main class="grid">
      <section class="col">
        <div class="panel next" id="hero"></div>
        <div class="panel gym">
          <div class="panel-head"><h2>Gym</h2><span class="sub" id="gym-sub"></span><span class="streak" id="gym-streak"></span></div>
          <div class="gweek" id="gym-week"></div>
          <button class="gym-btn" id="gym-btn"></button>
        </div>
        <div class="panel grow">
          <div class="panel-head"><h2>Schedule</h2><span class="sub" id="sched-sub"></span></div>
          <div class="scroll" id="schedule"></div>
        </div>
      </section>

      <section class="col">
        <div class="panel grow">
          <div class="panel-head"><h2>Due</h2><span class="sub" id="due-sub"></span></div>
          <div class="scroll" id="due"></div>
        </div>
      </section>

      <section class="col">
        <div class="panel grow">
          <div class="panel-head">
            <h2>Inbox</h2><span class="sub" id="inbox-sub"></span>
            <div class="seg" id="inbox-tabs" hidden><button data-view="focused">Focused</button><button data-view="all">All</button></div>
          </div>
          <div class="scroll" id="inbox"></div>
        </div>
        <div class="panel yt">
          <div class="panel-head">
            <h2>YouTube</h2><span class="sub" id="yt-sub"></span>
            <div class="seg" id="yt-tabs"></div>
          </div>
          <div class="scroll" id="videos"></div>
        </div>
      </section>
    </main>
  </div>

  <section class="sports" id="sports">
    <div class="sports-head">
      <h1>Sports</h1>
      <div class="seg big" id="sport-tabs"></div>
    </div>
    <div class="sports-grid">
      <div class="panel">
        <div class="panel-head"><h2>Games this week</h2><span class="sub" id="games-sub"></span></div>
        <div class="scroll" id="games"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Headlines</h2><span class="sub">from ESPN</span></div>
        <div class="scroll" id="news"></div>
      </div>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
